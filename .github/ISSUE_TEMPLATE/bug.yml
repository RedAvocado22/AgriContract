name: Bug
description: Something behaves differently from the design or contract.
title: "[P?][area] "
labels: ["type:fix"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, what should happen, and which doc/contract says so.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, request, or failing test. No real credentials or personal data.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] A test reproduces the bug and passes after the fix
    validations:
      required: true
