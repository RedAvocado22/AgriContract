name: CI

# push only for main: pull requests are covered by pull_request, so a PR push no longer runs CI twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.modules.outputs.java }}
      node: ${{ steps.modules.outputs.node }}
      analytics: ${{ steps.modules.outputs.analytics }}
      frontend: ${{ steps.modules.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      contract-files: ${{ steps.filter.outputs.contract-files }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      # ADDING A JAVA SERVICE/MODULE: add it in TWO places below, or CI never builds or tests it:
      #   1. a filter line here:      <module>: 'backend/<module>/**'
      #   2. the "all" list in the modules step
      # A new shared library goes in the "all" filter instead, so every module is rebuilt when it changes.
      # A new Node service or app needs its own filter, output and job (see analytics / frontend).
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # "all" = anything every module builds on; a change there runs every job.
          filters: |
            all:
              - 'backend/pom.xml'
              - 'backend/shared/java-eventing/**'
              - 'contracts/**'
              - '.github/workflows/**'
            api-gateway: 'backend/api-gateway/**'
            user-service: 'backend/user-service/**'
            product-service: 'backend/product-service/**'
            contract-service: 'backend/contract-service/**'
            escrow-service: 'backend/escrow-service/**'
            notification-service: 'backend/notification-service/**'
            reputation-service: 'backend/reputation-service/**'
            inspection-service: 'backend/inspection-service/**'
            bank-service: 'backend/bank-service/**'
            node:
              - 'backend/shared/node-eventing/**'
              - 'backend/notification-service-nest/**'
            analytics:
              - 'backend/shared/node-eventing/**'
              - 'backend/analytics-service/**'
            frontend: 'frontend/**'
            contracts:
              - 'contracts/**'
              - 'scripts/validate-contracts.py'
              - 'scripts/requirements-contracts.txt'
            contract-files: 'contracts/**'
            code:
              - 'backend/**'
              - 'frontend/**'

      - id: modules
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
        run: |
          # Keep in sync with the filters above (step 2 of "adding a Java service").
          all='["shared/java-eventing","api-gateway","user-service","product-service","contract-service","escrow-service","notification-service","reputation-service","inspection-service","bank-service"]'
          if [ "$EVENT" = "push" ] || echo "$CHANGES" | jq -e 'index("all")' > /dev/null; then
            java="$all"
            node=true
            analytics=true
            frontend=true
          else
            java=$(jq -cn --argjson all "$all" --argjson changed "$CHANGES" '$all - ($all - $changed)')
            node=$(echo "$CHANGES" | jq 'index("node") != null')
            analytics=$(echo "$CHANGES" | jq 'index("analytics") != null')
            frontend=$(echo "$CHANGES" | jq 'index("frontend") != null')
          fi
          {
            echo "java=$java"
            echo "node=$node"
            echo "analytics=$analytics"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"
          echo "Java modules: $java | node: $node | analytics: $analytics | frontend: $frontend"

  # Every PR closes exactly one issue (Definition of Done). Reads the current body through the API,
  # so fixing the description and re-running this job is enough; no new push needed.
  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh pr view "$PR" --repo "$REPO" --json body -q .body | grep -oiE '\bcloses #[0-9]+' | wc -l)
          echo "Closes references: $count"
          if [ "$count" -ne 1 ]; then
            echo "::error::PR description must contain exactly one 'Closes #<issue>' (found $count)."
            exit 1
          fi

  # Frozen contracts (#88): every file parses and is a valid OpenAPI / JSON Schema document with resolvable
  # $refs; on a PR, contracts/** may only be changed by the repo owner and never in the same PR as code.
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Contract changes follow the frozen-contract rule
        if: github.event_name == 'pull_request'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CONTRACT_OWNER: RedAvocado22
          CONTRACT_FILES_CHANGED: ${{ needs.changes.outputs.contract-files }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          if [ "$CONTRACT_FILES_CHANGED" != "true" ]; then
            echo "No file under contracts/ changed."
            exit 0
          fi
          if [ "$AUTHOR" != "$CONTRACT_OWNER" ]; then
            echo "::error::contracts/** is frozen: only @$CONTRACT_OWNER may change it (PR author: @$AUTHOR)."
            exit 1
          fi
          if [ "$CODE_CHANGED" = "true" ]; then
            echo "::error::A contract change must be its own PR, merged before the code that uses it (no backend/** or frontend/** in the same PR)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-contracts.txt

      - name: Validate contracts
        run: |
          pip install -q -r scripts/requirements-contracts.txt
          python scripts/validate-contracts.py
          python -m pytest -q scripts/test_validate_contracts.py

  java:
    needs: changes
    if: needs.changes.outputs.java != '[]'
    name: java (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.java) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Services resolve the shared library from the local repo, so install it (and the parent pom) first.
      - name: Install shared modules
        working-directory: backend
        run: mvn -B -q -pl shared/java-eventing -am install -DskipTests --no-transfer-progress

      # -amd also tests every module that depends on this one.
      - name: Build and test
        working-directory: backend
        run: mvn -B -pl ${{ matrix.module }} -amd verify --no-transfer-progress

  notification-service-node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/shared/node-eventing/package-lock.json
            backend/notification-service-nest/package-lock.json

      - name: Build and test node-eventing
        working-directory: backend/shared/node-eventing
        run: |
          npm ci
          npm run build
          npm test

      - name: Lint, test and build notification-service
        working-directory: backend/notification-service-nest
        run: |
          npm ci
          npm run lint:check
          npm test
          npm run build

  analytics-service:
    needs: changes
    if: needs.changes.outputs.analytics == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/shared/node-eventing/package-lock.json
            backend/analytics-service/package-lock.json

      # postinstall builds shared/node-eventing, which the service imports.
      - name: Typecheck, test and build
        working-directory: backend/analytics-service
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # build = tsc -b (typecheck) + vite build. No test runner in the app yet.
      - name: Lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  # The only required check on main. Jobs skipped by the path filter count as passed;
  # a failed or cancelled job fails the gate.
  ci-gate:
    needs: [changes, pr-policy, contracts, java, notification-service-node, analytics-service, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | jq -e 'any(. == "failure" or . == "cancelled")' > /dev/null; then
            exit 1
          fi
