openapi: 3.1.0
info:
  title: AgriContract Supplementary Service API (non–golden-flow surfaces)
  version: 1.0.0
  description: >-
    REST surfaces for the five services that sit OUTSIDE the frozen golden-flow
    transport contract (golden-flow-api.yaml): product, pricing, analytics,
    inspection (report submission) and file (internal only). These services are
    primarily event-driven; their events are frozen in golden-flow-events.yaml.
    This file formalizes the REST entry points each service design already
    specifies. Every write requires Idempotency-Key; JWT identity is
    authoritative; role/ownership denial returns 403; the shared 409 error
    envelope covers state/duplicate conflicts (same envelope as golden-flow).
    Sources: product-, pricing-, analytics-, inspection-, file-service
    phase-2 designs. Detailed request/response DTOs are owned by each service
    design; this catalog fixes path, method, owner, auth and idempotency.
    Phase 2 new writes and public operational schemas are limited to domestic
    Vietnam COFFEE flows; non-coffee values are legacy read-only data, not
    accepted variants in this contract.
servers:
  - url: /
paths:

  # ---------- product-service (public: seller/buyer create) ----------
  /api/v1/plots:
    post:
      operationId: registerPlot
      summary: Register a farm plot (KML import or manual pin); async geo-risk check follows
      description: >-
        Source product-service design §2.2. KML_IMPORT (POLYGON) or MANUAL_PIN
        (POINT only). Geo-risk verification runs async; a plot with
        geoVerificationStatus=PENDING cannot back a listing. Once the check has an
        outcome (CHECKED or UNVERIFIED) the plot can back a listing, subject to the
        geo-risk guards of product-service design §2.2.4.
      x-owner: product-service
      x-auth: SELLER
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        "201": { description: Plot registry entry created (geo-risk PENDING) }
        "400": { description: Validation failure }
        "403": { description: Role/ownership denied }
        "503": { description: Dependency (user eligibility) unavailable }
    get:
      operationId: listMyPlots
      summary: List the calling seller's own plot registry entries (pick plots for a listing)
      description: >-
        Source product-service design §2.1 and §4 (CreateListing/UpdateListing pick plots from the
        registry). Returns only entries whose sellerId is the caller; there is no parameter to read
        another seller's plots. The geometry itself is not returned (a list for picking plots does not
        need it); geoVerificationStatus tells the client which plots can back a listing (not PENDING).
        Newest import first.
      x-owner: product-service
      x-auth: SELLER
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: One page of the caller's plots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotRegistryPage' }
        "400": { description: "Validation failure: page or size out of range" }
        "403": { description: Caller is not a SELLER }

  /api/v1/categories:
    get:
      operationId: listApprovedCategories
      summary: List approved categories (pick a category when creating a product)
      description: >-
        Source product-service design §9 and api-gateway design §3.2 ("đọc danh mục"). Returns
        APPROVED categories only, ordered by name; PENDING and REJECTED categories are never listed
        here. commodity is null for a legacy category not mapped by the Operator; only a category
        with commodity COFFEE can back a new Phase 2 product. Not paged: the catalog is small.
      x-owner: product-service
      x-auth: JWT
      responses:
        "200":
          description: Approved categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategorySummary' }
        "401": { description: No signed-in caller }

  /api/v1/products/{productId}:
    get:
      operationId: getProduct
      summary: Read one product (public catalog detail)
      description: >-
        Source product-service design §2.6 and §8c. Public, matching the existing gateway
        rule for GET /api/v1/products/{productId}. Read-only fields only; no seller or plot data.
      x-owner: product-service
      x-auth: public
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        "404": { description: Unknown productId }

  /api/v1/listings:
    post:
      operationId: createListing
      summary: Create a listing from an approved plot/product
      description: >-
        Source product-service design §4. Fails closed when user-service is
        unavailable or actor is not KYC-valid / reputation-locked. Rejected when
        the selected plot is still geoVerificationStatus=PENDING. Every new
        listing must be COFFEE and must reference at least one plot whose
        geoVerificationStatus is CHECKED or UNVERIFIED (not PENDING). New rows
        initialize server-owned quantityAvailable from offeredQuantity; clients
        cannot write the inventory counter.
      x-owner: product-service
      x-auth: SELLER
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreateRequest' }
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingResponse' }
        "400": { description: Validation failure (e.g. plot geo PENDING) }
        "403": { description: Role/ownership denied or reputation-locked }
        "503": { description: user-service unavailable (fail closed) }
    get:
      operationId: searchListings
      summary: Search/filter listings
      description: Source product-service design; file-service §note defers listing search to product-service query params. Every returned listing includes the opaque listingVersionToken that a new buyer client must echo to CreateContract.
      x-owner: product-service
      x-auth: JWT
      x-invariant: >-
        Seller reputation (decision 05/11/2026, #265): a signed-in viewer gets each seller's
        score and locked flag, read from reputation-service with one
        getPublicReputationSummaries call per page (serviceAuth, never the gateway secret).
        The minSellerScore filter runs on the page read from the database, so a page can
        hold fewer than size items and totalElements counts before filtering. An unrated
        seller (score null) and a seller whose reputation could not be read both pass the
        filter. A reputation outage never fails or empties the search; it only sets
        reputationStatus to UNAVAILABLE. lockHistory is never exposed here.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: minSellerScore
          in: query
          required: false
          description: Keep a listing only when its seller's score is at least this. Requires a signed-in viewer.
          schema: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Listing page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingSearchPage' }
        "400": { description: "Validation failure: page, size or minSellerScore out of range" }
        "401": { description: minSellerScore sent without a signed-in viewer }

  /api/v1/listings/{listingId}:
    put:
      operationId: updateListing
      summary: Edit or republish a seller listing
      description: >-
        Seller-owned edit/republish. A legacy row with quantityAvailable=null remains readable
        but this successful command initializes quantityAvailable from offeredQuantity in the same
        transaction. The request never accepts quantityAvailable; the service validates the quality
        variant and does not reopen seller-close/PAUSED rows as a side effect of reservation release.
      x-owner: product-service
      x-auth: SELLER
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreateRequest' }
      responses:
        "200":
          description: Listing edited/republished; legacy inventory initialized when applicable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingResponse' }
        "400": { description: Validation or commodity/quality mismatch }
        "403": { description: Not the listing seller }
        "409": { description: Listing state/version conflict }

  /internal/v1/listing-reservations:
    post:
      operationId: reserveListingQuantity
      summary: Atomically reserve listing quantity for a generated contractId
      description: >-
        Contract-service calls this synchronously before persisting OFFERED. Product-service
        inserts a reservation unique by contractId and conditionally decrements
        quantityAvailable in the same transaction. Replay with the same contractId and
        payload returns the original reservation without another decrement. Legacy null,
        below-minimum, or insufficient quantity returns 409 INSUFFICIENT_LISTING_QUANTITY.
      x-owner: product-service
      x-auth: service-to-service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveListingQuantityRequest' }
      responses:
        "200":
          description: Existing idempotent reservation returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingReservationResponse' }
        "201":
          description: Quantity reserved and listing counter decremented atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingReservationResponse' }
        "409": { description: "INSUFFICIENT_LISTING_QUANTITY, LISTING_VERSION_MISMATCH, or reservation/listing state conflict" }

  /internal/v1/listings/{listingId}/contract-snapshot:
    get:
      operationId: getListingContractSnapshot
      summary: Read the goods snapshot source for a contract at the buyer's listing version
      description: >-
        Contract-service calls this synchronously at create, before reserveListingQuantity, and
        stores the body unchanged as goodsTerms of the new contract (golden-flow-api.yaml
        GoodsTermsSnapshot). Product-service compares listingVersionToken with the exact current
        token first; a mismatch returns 409 LISTING_VERSION_MISMATCH. The body is built from the
        listing's own copies (productName, cropYear, harvestSeason, regionText and plot refs,
        copied at listing create) plus the current category name, so a later edit of the Product
        or PlotRegistryEntry does not change it; once the contract stores it, no source change
        reaches the contract. Listing status and quantity are NOT checked here:
        reserveListingQuantity, called next with the same token, owns
        INSUFFICIENT_LISTING_QUANTITY and listing state conflicts. A listing that cannot back a
        coffee contract (legacy row without COFFEE commodity, category, regionText or at least
        one plot) returns 409 LISTING_STATE_CONFLICT. product-service never returns
        traceabilitySnapshot. Read-only and safe to repeat.
      x-owner: product-service
      x-auth: service-to-service
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: listingVersionToken, in: query, required: true, schema: { type: string, minLength: 1 }, description: Exact opaque token from ListingResponse that the buyer saw. }
      responses:
        "200":
          description: Goods snapshot source at the requested listing version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingContractSnapshot' }
        "400": { description: listingVersionToken missing or blank }
        "401": { description: Missing or invalid X-Internal-Secret }
        "404": { description: Listing not found }
        "409": { description: "LISTING_VERSION_MISMATCH, or LISTING_STATE_CONFLICT for a listing that cannot back a coffee contract" }

  /internal/v1/listing-reservations/{contractId}/release:
    post:
      operationId: compensateListingReservation
      summary: Idempotently release a reservation after contract-create persistence failure
      description: >-
        Compensation path used only when product reserve succeeded but contract-service could
        not persist OFFERED. A reservation already RELEASED returns success without restoring
        twice; a COMMITTED reservation is a state conflict. Seller-closed and PAUSED listing
        states are preserved while quantityAvailable is restored.
      x-owner: product-service
      x-auth: service-to-service
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseListingReservationRequest' }
      responses:
        "204": { description: Reservation released or identical compensation already applied }
        "404": { description: Reservation not found }
        "409": { description: Reservation is COMMITTED or payload/state conflicts }

  /api/v1/listings/{listingId}/offers:
    post:
      operationId: createOffer
      summary: Buyer creates an offer against a listing
      description: >-
        Source product-service design §4. Fails closed on user-service outage /
        actor not eligible. The accepted offer becomes the contract seed
        (createContract in golden-flow-api.yaml consumes listingId).
      x-owner: product-service
      x-auth: BUYER
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        "201": { description: Offer created }
        "400": { description: Validation failure }
        "403": { description: Role/ownership denied or reputation-locked }
        "503": { description: user-service unavailable (fail closed) }

  # ---------- pricing-service (public reference prices) ----------
  /api/v1/prices/{commodity}/{province}:
    get:
      operationId: getPriceQuote
      summary: Latest reference price for a commodity/province
      description: >-
        Source pricing-service design §4. Public, no auth (reference data).
        Phase 2 serves COFFEE only; item remains optional because the coffee
        profile owns one canonical item slug. Cache-aside on Redis with MySQL
        price_history as source of truth.
      x-owner: pricing-service
      x-auth: public
      parameters:
        - { name: commodity, in: path, required: true, schema: { type: string, const: COFFEE } }
        - { name: province, in: path, required: true, schema: { type: string } }
        - { name: item, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Price quote }
        "404": { description: No quote for commodity/province/item }
  /api/v1/prices/{commodity}/{province}/items:
    get:
      operationId: listPriceItems
      summary: List available item names for a commodity/province (autocomplete)
      description: Source pricing-service design §4; lists the canonical coffee item names available for the province.
      x-owner: pricing-service
      x-auth: public
      parameters:
        - { name: commodity, in: path, required: true, schema: { type: string, const: COFFEE } }
        - { name: province, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Item name list }
  /api/v1/prices/manual:
    post:
      operationId: recordManualPrice
      summary: Operator records a fallback coffee reference price
      description: Source pricing-service design §3.2. Phase 2 accepts COFFEE only and records an explicit source/province when automated ingestion needs an operator fallback.
      x-owner: pricing-service
      x-auth: OPERATOR
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        "201": { description: Manual price recorded }
        "403": { description: "Not OPERATOR (no ADMIN fallback, data-governance 5.4)" }

  # ---------- analytics-service (dashboard reads, Admin/Association) ----------
  /api/v1/analytics/terminations:
    get:
      operationId: getTerminationAnalytics
      summary: Termination breakdown by type/requester/final role
      description: Source analytics-service design §4. Redis-cached (TTL 1h). Eventual consistency; no historical backfill before deploy.
      x-owner: analytics-service
      x-auth: ADMIN
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Termination analytics }
        "403": { description: Not ADMIN/Association }
  /api/v1/analytics/escrow-effectiveness:
    get:
      operationId: getEscrowEffectiveness
      summary: Escrow effectiveness metrics for a month
      description: Source analytics-service design §4. Redis-cached (TTL 1h).
      x-owner: analytics-service
      x-auth: ADMIN
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, description: "YYYY-MM" } }
      responses:
        "200": { description: Escrow effectiveness metrics }
        "403": { description: Not ADMIN/Association }
  /api/v1/analytics/force-majeure-trends:
    get:
      operationId: getForceMajeureTrends
      summary: Force-majeure claim trends for a year
      description: Source analytics-service design §4. Redis-cached (TTL 1h).
      x-owner: analytics-service
      x-auth: ADMIN
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Force-majeure trend metrics }
        "403": { description: Not ADMIN/Association }

  # ---------- inspection-service (Level 1.5 report submission) ----------
  /api/v1/inspections/{contractId}/milestones/{milestoneId}/reports:
    post:
      operationId: submitInspectionReport
      summary: INSPECTOR submits a Level 1.5 report with signature commitment
      description: >-
        Source inspection-service design §2-3. Report body hashed; INSPECTOR
        signature persisted in inspector_signature (inspection DB) with
        UNIQUE(report_id) and step-up/session-freshness identity. Level 2
        commissioning is ARBITRATOR-triggered (InitiateLevel2Inspection) via
        the contract/milestone dispute flow, not a public route.
      x-owner: inspection-service
      x-auth: INSPECTOR
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string } }
        - { name: milestoneId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectionReportSubmission' }
      responses:
        "201": { description: Report recorded and signed }
        "400": { description: Malformed report submission }
        "403": { description: "Not the INSPECTOR of the active Level 1.5 assignment for this milestone, or eligibility (KYC/license expiry) failed (inspection design 2.5)" }
        "409": { description: Report already signed (UNIQUE report_id) }
        "503": { description: Eligibility dependency (user-service) unavailable; fail closed per error catalog }

  # ---------- file-service (INTERNAL ONLY — gateway does not expose) ----------
  /internal/v1/files:
    post:
      operationId: storeOnBehalfOf
      summary: Business service stores an end-user file on behalf of an actor (DIRECT_UPLOAD)
      description: >-
        Source file-service design §2.1/§3 (StoreOnBehalfOf, 17/07). Service-to-
        service only (mTLS/service token); gateway never exposes file-service.
        uploadedBy=actingUserId passed explicitly; virus-scan + 10MB cap +
        contentType whitelist enforced; ingestChannel fixed to DIRECT_UPLOAD by
        the entrypoint (caller cannot self-declare SYSTEM_GENERATED).
      x-owner: file-service
      x-auth: service-to-service
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        "202": { description: Accepted; file PROCESSING (file.ready/file.failed follows) }
        "400": { description: contentType/size validation failure }
        "403": { description: Not a trusted service principal }
  /internal/v1/files/{fileId}:
    get:
      operationId: getFile
      summary: Fetch file bytes (service-to-service or owner/Admin)
      description: Source file-service design §3. Not public; owning service proxies to end-users.
      x-owner: file-service
      x-auth: service-to-service
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: File bytes }
        "403": { description: Not owner/service/Admin }
        "404": { description: Not found or not READY }
    delete:
      operationId: deleteFile
      summary: Owning service requests deletion (explicit; blocked by legal hold)
      description: Source file-service design §3. Two-step tombstone+blob delete; legalHold rejects.
      x-owner: file-service
      x-auth: service-to-service
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: Deletion accepted }
        "409": { description: Legal hold active — deletion denied }
  /internal/v1/files/{fileId}/confirm-attached:
    post:
      operationId: confirmAttached
      summary: Owning service confirms it persisted the fileId (orphan-cleanup guard)
      description: Source file-service design §3. Sets attached=TRUE; unconfirmed files >1 week are orphan-cleaned.
      x-owner: file-service
      x-auth: service-to-service
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: Marked attached }
        "404": { description: Unknown fileId }

components:
  schemas:
    CategorySummary:
      type: object
      additionalProperties: false
      required: [categoryId, name, commodity]
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        commodity: { type: ['string', 'null'], enum: [COFFEE, null], description: Null for a legacy category the Operator has not mapped. }
    PlotRegistryItem:
      type: object
      additionalProperties: false
      required: [registryEntryId, householdLabel, geometryType, areaHectares, source, declaredProvince, geoVerificationStatus, geoRiskLevel, importedAt]
      properties:
        registryEntryId: { type: string, format: uuid }
        householdLabel: { type: string, minLength: 1 }
        geometryType: { enum: [POINT, POLYGON] }
        areaHectares: { type: ['number', 'null'], minimum: 0, description: Null for a POINT entry. }
        source: { enum: [KML_IMPORT, MANUAL_PIN] }
        declaredProvince: { type: ['string', 'null'], description: Province the seller declared; null when not declared. }
        geoVerificationStatus: { enum: [PENDING, CHECKED, UNVERIFIED], description: PENDING cannot back a listing. }
        geoRiskLevel: { type: ['string', 'null'], enum: [LOW_RISK, HIGH_RISK, INCONCLUSIVE, null], description: Null while PENDING. }
        importedAt: { type: string, format: date-time }
    PlotRegistryPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/PlotRegistryItem' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ProductResponse:
      type: object
      additionalProperties: false
      required: [productId, name, unit, categoryId, images, cropYear, harvestSeason, certifications]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        unit: { const: kg, description: Canonical kilogram (product design §8b). }
        categoryId: { type: string, format: uuid }
        images: { type: array, minItems: 1, maxItems: 5, items: { type: string, format: uri } }
        cropYear: { type: ['integer', 'null'] }
        harvestSeason: { type: ['string', 'null'] }
        certifications: { type: ['array', 'null'], items: { type: string }, description: Seller-provided free-text commitments; not verified. }
    ErrorEnvelope:
      description: Shared error envelope, identical to golden-flow (timestamp,status,error,code,message,path,traceId).
      type: object
    CoffeeQualitySpec:
      type: object
      required: [commodity, type, moisturePercent, foreignMatterPercent, blackBrokenBeansPercent]
      additionalProperties: false
      properties:
        commodity: { const: COFFEE }
        type: { enum: [ARABICA, ROBUSTA] }
        moisturePercent: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        foreignMatterPercent: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        blackBrokenBeansPercent: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
      example: { commodity: COFFEE, type: ROBUSTA, moisturePercent: 12.5, foreignMatterPercent: 0.5, blackBrokenBeansPercent: 5.0 }
    ListingCreateCommon:
      type: object
      required: [productId, productName, unitOfMeasure, offeredQuantity, minOrderQuantity, askingUnitPrice, regionText, registryEntryIds]
      x-invariant: minOrderQuantity must be less than or equal to offeredQuantity.
      description: >-
        Fields the seller sends. categoryId and commodity are not request fields: product-service
        derives them from the product (design §8c) and returns them on the listing response.
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string, minLength: 1 }
        unitOfMeasure: { const: KG, description: Compatibility confirmation of the system-wide canonical kilogram unit; no separate quantityUnit is introduced. }
        offeredQuantity: { type: number, exclusiveMinimum: 0, description: Offered quantity in canonical kilograms (kg). }
        minOrderQuantity: { type: number, exclusiveMinimum: 0, description: Seller-defined minimum quantity for one contract in canonical kilograms (kg); must not exceed offeredQuantity. }
        askingUnitPrice: { type: string, pattern: '^[0-9]+\.[0-9]{2}$', maxLength: 11, description: "Technical maximum 99,999,999.99 VND/kg; this is not a business pricing policy." }
        regionText: { type: string, minLength: 1 }
        packagingDeclaration: { type: [string, 'null'], description: Seller-provided packaging declaration for display only. }
        warehouseLocation: { type: [string, 'null'], description: Seller-provided warehouse location; distinct from the contract delivery point. }
        estimatedAvailabilityDate: { type: [string, 'null'], format: date }
        registryEntryIds: { type: array, items: { type: string, format: uuid } }
    CoffeeListingCreate:
      allOf:
        - { $ref: '#/components/schemas/ListingCreateCommon' }
        - type: object
          required: [declaredQualitySpec]
          properties:
            declaredQualitySpec: { $ref: '#/components/schemas/CoffeeQualitySpec' }
            registryEntryIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
            traceabilityEvidencePackageId: { type: [string, 'null'], format: uuid }
      unevaluatedProperties: false
    ListingCreateRequest:
      $ref: '#/components/schemas/CoffeeListingCreate'
    ListingResponseCommon:
      allOf:
        - { $ref: '#/components/schemas/ListingCreateCommon' }
        - type: object
          required: [listingId, sellerId, categoryId, commodity, status, quantityAvailable, legacyQualitySpecMissing, listingVersionToken, cropYear, harvestSeason, certifications]
          properties:
            listingId: { type: string, format: uuid }
            categoryId: { type: string, format: uuid, readOnly: true, description: Read-only field derived from Product at creation. }
            commodity: { const: COFFEE, readOnly: true, description: Read-only field derived from Category at creation. }
            sellerId: { type: string, format: uuid }
            status: { enum: [DRAFT, AVAILABLE, PARTIALLY_COMMITTED, PAUSED, CLOSED] }
            quantityAvailable:
              type: [number, 'null']
              minimum: 0
              readOnly: true
              description: Server-owned remaining reservable quantity in kg. Null only for a legacy row, which fails reservation closed until seller edit/republish initializes it from offeredQuantity.
            legacyQualitySpecMissing: { type: boolean, description: Legacy rows may be true until their next edit or republish. }
            listingVersionToken: { type: string, minLength: 1, description: Opaque optimistic-concurrency token generated from the canonical UTC representation of Listing.updatedAt in Phase 2; clients must echo the exact value when creating a contract. }
            cropYear:
              type: [integer, 'null']
              readOnly: true
              description: Read-only field derived from Product. Seller-declared crop year; null when not applicable to the seasonal goods.
            harvestSeason:
              type: [string, 'null']
              readOnly: true
              description: Read-only field derived from Product. Seller-described harvest season; null when not applicable to the seasonal goods.
            certifications:
              type: [array, 'null']
              items: { type: string }
              readOnly: true
              description: Read-only field derived from Product. Seller-provided free-text commitments for future goods; no platform typing or expiry semantics.
    CoffeeListingResponse:
      allOf:
        - { $ref: '#/components/schemas/ListingResponseCommon' }
        - type: object
          required: [declaredQualitySpec]
          properties:
            commodity: { const: COFFEE }
            declaredQualitySpec:
              oneOf: [{ $ref: '#/components/schemas/CoffeeQualitySpec' }, { type: 'null' }]
            registryEntryIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
            traceabilityEvidencePackageId: { type: [string, 'null'], format: uuid }
    ListingResponse:
      allOf:
        - { $ref: '#/components/schemas/CoffeeListingResponse' }
      unevaluatedProperties: false
      x-invariant: declaredQualitySpec may be null only for a legacy row with legacyQualitySpecMissing=true; edit or republish must supply the matching non-null variant.
    SellerReputation:
      type: object
      required: [score, locked]
      additionalProperties: false
      description: Copied from ReputationBatchSummaryItem (golden-flow-api.yaml); lockHistory is never copied.
      properties:
        score: { type: [integer, 'null'], minimum: 0, maximum: 100, description: null when the seller has no history yet. }
        locked: { type: boolean }
    ListingSearchItem:
      allOf:
        - { $ref: '#/components/schemas/CoffeeListingResponse' }
        - type: object
          required: [sellerReputation]
          properties:
            sellerReputation:
              oneOf:
                - { $ref: '#/components/schemas/SellerReputation' }
                - { type: 'null' }
              description: null for an anonymous viewer or when this seller's reputation could not be read.
      unevaluatedProperties: false
    ListingSearchPage:
      type: object
      required: [content, page, size, totalElements, totalPages, first, last, empty, reputationStatus]
      additionalProperties: false
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/ListingSearchItem' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, minimum: 0, description: Active listings before the minSellerScore filter. }
        totalPages: { type: integer, minimum: 0 }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }
        reputationStatus:
          enum: [AVAILABLE, UNAVAILABLE, SIGN_IN_REQUIRED]
          description: AVAILABLE every seller read; UNAVAILABLE at least one seller could not be read (kept, not filtered); SIGN_IN_REQUIRED anonymous viewer, no reads.
    ReserveListingQuantityRequest:
      type: object
      required: [contractId, listingId, requestedQuantity, listingVersionToken]
      additionalProperties: false
      properties:
        contractId: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        requestedQuantity: { type: number, exclusiveMinimum: 0, description: Contract-service-derived sum of milestone committedQuantity in canonical kilograms (kg). }
        listingVersionToken: { type: string, minLength: 1, description: Exact opaque token returned by ListingResponse. }
      x-invariant: Product-service validates minOrderQuantity <= requestedQuantity <= quantityAvailable inside the reservation transaction.
    ListingReservationResponse:
      type: object
      required: [contractId, listingId, reservedQuantity, state, quantityAvailable]
      additionalProperties: false
      properties:
        contractId: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        reservedQuantity: { type: number, exclusiveMinimum: 0, description: Reserved quantity in canonical kilograms (kg). }
        state: { enum: [RESERVED, SIGNED_RELEASABLE, COMMITTED, RELEASED] }
        quantityAvailable: { type: number, minimum: 0, description: Remaining listing quantity after this reservation; canonical kilograms (kg). }
    ReleaseListingReservationRequest:
      type: object
      required: [listingId, reservedQuantity, reason]
      additionalProperties: false
      properties:
        listingId: { type: string, format: uuid }
        reservedQuantity: { type: number, exclusiveMinimum: 0, description: Expected reservation quantity used to reject compensate-with-different-payload. }
        reason: { const: CREATE_PERSISTENCE_COMPENSATION }
    ListingContractSnapshotPlotRef:
      description: Same fields as PlotRefSnapshot (golden-flow-api.yaml), taken from the listing's plot copy, not the live registry entry.
      type: object
      required: [registryEntryId, householdLabel, geometryType, geometryHash, verificationLevel]
      additionalProperties: false
      properties:
        registryEntryId: { type: string, format: uuid }
        householdLabel: { type: string, minLength: 1 }
        geometryType: { enum: [POINT, POLYGON] }
        geometryHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        verificationLevel: { enum: [SELF_DECLARED, CADASTRAL_BACKED] }
    ListingContractSnapshot:
      description: >-
        Field for field the golden-flow-api.yaml GoodsTermsSnapshot without traceabilitySnapshot,
        so contract-service can store it as goodsTerms unchanged. plotRefs are ordered by
        householdLabel so repeated reads of the same version are identical.
      type: object
      required: [commodity, listingId, productId, categoryId, categoryName, productName, unitOfMeasure, cropYear, harvestSeason, originSnapshot]
      additionalProperties: false
      properties:
        commodity: { const: COFFEE }
        listingId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string, minLength: 1, description: Current name of the listing's category. }
        productName: { type: string, minLength: 1, description: Product name copied at listing create. }
        unitOfMeasure: { const: KG }
        cropYear: { type: [integer, 'null'], description: Copied from the Product at listing create. }
        harvestSeason: { type: [string, 'null'], description: Copied from the Product at listing create. }
        originSnapshot:
          type: object
          required: [regionText, plotRefs]
          additionalProperties: false
          properties:
            regionText: { type: string, minLength: 1 }
            plotRefs: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ListingContractSnapshotPlotRef' } }
    CoffeeActualMetrics:
      type: object
      required: [commodity, type, moisturePercent, foreignMatterPercent, blackBrokenBeansPercent]
      additionalProperties: false
      properties:
        commodity: { const: COFFEE }
        type: { enum: [ARABICA, ROBUSTA] }
        moisturePercent: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        foreignMatterPercent: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        blackBrokenBeansPercent: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
      example: { commodity: COFFEE, type: ROBUSTA, moisturePercent: 13.0, foreignMatterPercent: 0.7, blackBrokenBeansPercent: 5.5 }
    ActualQualityMetrics:
      $ref: '#/components/schemas/CoffeeActualMetrics'
    InspectionSettlementResultV1:
      description: Quantity, measurement status and typed actual metrics only. Delivery certificates and quality disposition are outside normalizedResult/resultHash.
      type: object
      required: [resultSchemaVersion, measuredQuantityKg, acceptedQuantityKg, measurementStatus, actualQualityMetrics, determinedAt]
      additionalProperties: false
      allOf:
        - if:
            properties: { measurementStatus: { const: INCONCLUSIVE } }
            required: [measurementStatus]
          then:
            required: [inconclusiveReasons]
            properties:
              inconclusiveReasons: {}
      properties:
        resultSchemaVersion: { const: '1.0' }
        measuredQuantityKg: { type: number, minimum: 0, maximum: 1000000, multipleOf: 0.001, description: Inspector-measured quantity in canonical kilograms (kg). }
        acceptedQuantityKg: { type: number, minimum: 0, maximum: 1000000, multipleOf: 0.001, description: Quantity accepted for entitlement in canonical kilograms (kg). }
        measurementStatus: { enum: [COMPLETE, INCONCLUSIVE] }
        actualQualityMetrics: { $ref: '#/components/schemas/ActualQualityMetrics' }
        inconclusiveReasons: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        determinedAt: { type: string, format: date-time }
      x-invariant: acceptedQuantityKg must not exceed measuredQuantityKg; inconclusiveReasons is required when measurementStatus is INCONCLUSIVE; no delivery certificate may be parsed or copied into actualQualityMetrics. Numeric bounds (max 1,000,000 kg, 3 decimals for kg, 2 for percentages) are technical guardrails so values round-trip exactly through RFC 8785; see golden-flow-events.yaml inspectionSettlementResultV1.
    InspectionReportSubmission:
      type: object
      required: [reportFileId, normalizedResult]
      additionalProperties: false
      properties:
        reportFileId: { type: string, format: uuid }
        normalizedResult: { $ref: '#/components/schemas/InspectionSettlementResultV1' }
