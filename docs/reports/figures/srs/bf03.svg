<rect x="7.0" y="76.0" width="156" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="85.0" y="92.5">1. Choose a listing</tspan><tspan x="85.0" y="107.5">and create an offer</tspan></text>
<rect x="360.0" y="76.0" width="230" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="475.0" y="92.5">2. Validate the terms and</tspan><tspan x="475.0" y="107.5">reserve the listing quantity</tspan></text>
<rect x="177.0" y="143.5" width="156" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="255.0" y="160.0">3. Review and revise</tspan><tspan x="255.0" y="175.0">the terms (either</tspan><tspan x="255.0" y="190.0">party)</tspan></text>
<polygon points="255.0,220.0 270.0,235 255.0,250.0 240.0,235" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="177.0" y="268.5" width="156" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="255.0" y="285.0">4. Withdraw the offer</tspan><tspan x="255.0" y="300.0">(either party, before</tspan><tspan x="255.0" y="315.0">the second signature)</tspan></text>
<rect x="360.0" y="268.5" width="230" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="475.0" y="285.0">5. Mark WITHDRAWN, release</tspan><tspan x="475.0" y="300.0">the quantity, notify the</tspan><tspan x="475.0" y="315.0">other party</tspan></text>
<circle cx="475.0" cy="360" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="475.0" cy="360" r="8.0" fill="black"/>
<rect x="20.0" y="382.0" width="300" height="6" fill="black"/>
<rect x="7.0" y="411.0" width="156" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="85.0" y="427.5">6. Sign the terms</tspan><tspan x="85.0" y="442.5">with an e-mail OTP</tspan></text>
<rect x="177.0" y="403.5" width="156" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="255.0" y="420.0">7. Sign the same</tspan><tspan x="255.0" y="435.0">terms with an</tspan><tspan x="255.0" y="450.0">e-mail OTP</tspan></text>
<path d="M362.5,404.5 L577.5,404.5 L587.5,414.5 L587.5,465.5 L362.5,465.5 Z" fill="white" stroke="black"/><path d="M577.5,404.5 L577.5,414.5 L587.5,414.5" fill="none" stroke="black"/>
<text text-anchor="start" dominant-baseline="central" font-size="12"><tspan x="372.5" y="420.0">Either party may sign first;</tspan><tspan x="372.5" y="435.0">both signatures must be on</tspan><tspan x="372.5" y="450.0">the same terms fingerprint</tspan></text>
<rect x="20.0" y="492.0" width="300" height="6" fill="black"/>
<rect x="360.0" y="521.0" width="230" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="475.0" y="537.5">8. Check both signatures</tspan><tspan x="475.0" y="552.5">match the terms (SIGNED)</tspan></text>
<rect x="360.0" y="586.0" width="230" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="475.0" y="602.5">9. Ask the bank to lock both</tspan><tspan x="475.0" y="617.5">deposits (automatic retries)</tspan></text>
<polygon points="475.0,655.0 490.0,670 475.0,685.0 460.0,670" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="375.0" y="706.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="475.0" y="722.5">10. Activate the contract</tspan><tspan x="475.0" y="737.5">(ACTIVE)</tspan></text>
<circle cx="475.0" cy="780" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="475.0" cy="780" r="8.0" fill="black"/>
<rect x="375.0" y="821.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="475.0" y="837.5">11. Notify both parties</tspan><tspan x="475.0" y="852.5">and Operator</tspan></text>
<polygon points="475.0,895.0 490.0,910 475.0,925.0 460.0,910" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="617.0" y="886.0" width="156" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="695.0" y="902.5">12. Fix the cause and</tspan><tspan x="695.0" y="917.5">retry the deposit lock</tspan></text>
<rect x="177.0" y="871.0" width="156" height="78.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="255.0" y="887.5">13. Request the cancel</tspan><tspan x="255.0" y="902.5">with an e-mail OTP</tspan><tspan x="255.0" y="917.5">(both, or one after</tspan><tspan x="255.0" y="932.5">5 business days)</tspan></text>
<rect x="360.0" y="953.5" width="230" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="475.0" y="970.0">14. Return the locked deposits,</tspan><tspan x="475.0" y="985.0">release the quantity</tspan><tspan x="475.0" y="1000.0">(ACTIVATION_FAILED)</tspan></text>
<circle cx="475.0" cy="1045" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="475.0" cy="1045" r="8.0" fill="black"/>
