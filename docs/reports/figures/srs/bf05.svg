<rect x="696.0" y="923" width="85.921875" height="41.25" fill="white"/>
<text text-anchor="start" dominant-baseline="central" font-size="11"><tspan x="698.0" y="929.875">[material breach,</tspan><tspan x="698.0" y="943.625">termination</tspan><tspan x="698.0" y="957.375">requested]</tspan></text>
<path d="M690.0,1021.0 L690.0,1039.0" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M675.0,905 L503.0,905" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<rect x="510.0" y="887" width="57.1875" height="13.75" fill="white"/>
<text text-anchor="start" dominant-baseline="central" font-size="11"><tspan x="512.0" y="893.875">[otherwise]</tspan></text>
<circle cx="100.0" cy="55" r="12.0" fill="black"/>
<rect x="10.0" y="86.0" width="180" height="78.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="100.0" y="102.5">1. Report a breach or</tspan><tspan x="100.0" y="117.5">claim force majeure (or</tspan><tspan x="100.0" y="132.5">the System detects a</tspan><tspan x="100.0" y="147.5">missed obligation)</tspan></text>
<rect x="590.0" y="86.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="690.0" y="102.5">2. Record the case and</tspan><tspan x="690.0" y="117.5">notify the other party</tspan></text>
<path d="M680.0,157.0 L780.0,157.0 L790.0,167.0 L790.0,203.0 L680.0,203.0 Z" fill="white" stroke="black"/><path d="M780.0,157.0 L780.0,167.0 L790.0,167.0" fill="none" stroke="black"/>
<text text-anchor="start" dominant-baseline="central" font-size="12"><tspan x="690.0" y="172.5">No penalty on</tspan><tspan x="690.0" y="187.5">an allegation</tspan></text>
<rect x="210.0" y="188.5" width="180" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="300.0" y="205.0">3. Review the evidence</tspan><tspan x="300.0" y="220.0">against the signed</tspan><tspan x="300.0" y="235.0">terms</tspan></text>
<polygon points="300.0,270.0 315.0,285 300.0,300.0 285.0,285" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="220.0" y="333.5" width="160" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="300.0" y="350.0">4. Request an</tspan><tspan x="300.0" y="365.0">inspection per the</tspan><tspan x="300.0" y="380.0">signed terms</tspan></text>
<rect x="410.0" y="341.0" width="160" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="490.0" y="357.5">5. Inspect and</tspan><tspan x="490.0" y="372.5">submit a report</tspan></text>
<polygon points="300.0,420.0 315.0,435 300.0,450.0 285.0,435" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="205.0" y="468.5" width="190" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="300.0" y="485.0">6. Record the breaching</tspan><tspan x="300.0" y="500.0">party and the evidence</tspan><tspan x="300.0" y="515.0">used</tspan></text>
<rect x="590.0" y="468.5" width="200" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="690.0" y="485.0">7. Notify the parties and</tspan><tspan x="690.0" y="500.0">open the 2-business-day</tspan><tspan x="690.0" y="515.0">contest window</tspan></text>
<path d="M405.0,554.5 L565.0,554.5 L575.0,564.5 L575.0,615.5 L405.0,615.5 Z" fill="white" stroke="black"/><path d="M565.0,554.5 L565.0,564.5 L575.0,564.5" fill="none" stroke="black"/>
<text text-anchor="start" dominant-baseline="central" font-size="12"><tspan x="415.0" y="570.0">Penalty, forfeiture and</tspan><tspan x="415.0" y="585.0">lock wait; no-fault</tspan><tspan x="415.0" y="600.0">refunds run at once</tspan></text>
<polygon points="690.0,640.0 705.0,655 690.0,670.0 675.0,655" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="10.0" y="631.0" width="180" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="100.0" y="647.5">8. Submit a contest</tspan><tspan x="100.0" y="662.5">with evidence</tspan></text>
<rect x="405.0" y="698.5" width="170" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="490.0" y="715.0">9. Level 1.5 reviews</tspan><tspan x="490.0" y="730.0">the case; the decision</tspan><tspan x="490.0" y="745.0">is final</tspan></text>
<path d="M405.0,784.5 L565.0,784.5 L575.0,794.5 L575.0,845.5 L405.0,845.5 Z" fill="white" stroke="black"/><path d="M565.0,784.5 L565.0,794.5 L575.0,794.5" fill="none" stroke="black"/>
<text text-anchor="start" dominant-baseline="central" font-size="12"><tspan x="415.0" y="800.0">Not available if the</tspan><tspan x="415.0" y="815.0">decision already rests</tspan><tspan x="415.0" y="830.0">on an inspection</tspan></text>
<polygon points="690.0,770.0 705.0,785 690.0,800.0 675.0,785" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="590.0" y="821.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="690.0" y="837.5">10. Finalize the decision</tspan><tspan x="690.0" y="852.5">and execute the remedy</tspan></text>
<polygon points="690.0,890.0 705.0,905 690.0,920.0 675.0,905" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="590.0" y="973.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="690.0" y="989.5">11. Settle the remaining</tspan><tspan x="690.0" y="1004.5">scope, close the contract</tspan></text>
<circle cx="690.0" cy="1052" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="690.0" cy="1052" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="690.0" y="1078.5">Contract terminated</tspan></text>
<circle cx="490.0" cy="905" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="490.0" cy="905" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="490.0" y="931.5">Contract stays active</tspan></text>
