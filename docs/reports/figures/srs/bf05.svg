<path d="M680.0,992.0 L680.0,954.0" fill="none" stroke="black" stroke-width="1.1" stroke-dasharray="5,4"/>
<path d="M790.0,930 L915.0,930 L915.0,1020 L955.0,1020" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M970.0,855.0 L970.0,1005.0" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
