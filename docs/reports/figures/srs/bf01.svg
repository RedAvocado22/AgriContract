<circle cx="120.0" cy="60" r="12.0" fill="black"/>
<rect x="20.0" y="93.5" width="200" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="120.0" y="110.0">1. Register an account</tspan><tspan x="120.0" y="125.0">as Buyer, Seller</tspan><tspan x="120.0" y="140.0">or Inspector</tspan></text>
<rect x="490.0" y="101.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="585.0" y="117.5">2. Create the account</tspan><tspan x="585.0" y="132.5">awaiting KYC</tspan></text>
<rect x="20.0" y="188.5" width="200" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="120.0" y="205.0">3. Submit organization</tspan><tspan x="120.0" y="220.0">and representative</tspan><tspan x="120.0" y="235.0">documents</tspan></text>
<rect x="490.0" y="276.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="585.0" y="292.5">4. Add the profile to</tspan><tspan x="585.0" y="307.5">the KYC review queue</tspan></text>
<rect x="255.0" y="353.5" width="200" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="355.0" y="370.0">5. Check the documents</tspan><tspan x="355.0" y="385.0">and the authority</tspan><tspan x="355.0" y="400.0">to represent</tspan></text>
<polygon points="355.0,445.0 370.0,460 355.0,475.0 340.0,460" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="260.0" y="503.5" width="190" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="355.0" y="520.0">6. Verify KYC and enter</tspan><tspan x="355.0" y="535.0">the authorization</tspan><tspan x="355.0" y="550.0">expiry</tspan></text>
<rect x="490.0" y="511.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="585.0" y="527.5">7. Enable trading and</tspan><tspan x="585.0" y="542.5">e-mail the result</tspan></text>
<circle cx="585.0" cy="605" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="585.0" cy="605" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="585.0" y="631.5">Account verified</tspan></text>
<rect x="275.0" y="666.0" width="160" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="355.0" y="682.5">8. Reject with</tspan><tspan x="355.0" y="697.5">a reason</tspan></text>
<rect x="490.0" y="666.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="585.0" y="682.5">9. E-mail the</tspan><tspan x="585.0" y="697.5">rejection reason</tspan></text>
<circle cx="585.0" cy="760" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="585.0" cy="760" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="585.0" y="786.5">Account not verified</tspan></text>
</svg>