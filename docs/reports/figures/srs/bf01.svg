<rect x="40.0" y="116.0" width="220" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="150.0" y="132.5">1. Register an account as</tspan><tspan x="150.0" y="147.5">Buyer, Seller or Inspector</tspan></text>
<rect x="640.0" y="116.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="740.0" y="132.5">2. Create the account</tspan><tspan x="740.0" y="147.5">awaiting KYC</tspan></text>
<rect x="40.0" y="216.0" width="220" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="150.0" y="232.5">3. Submit organization and</tspan><tspan x="150.0" y="247.5">representative documents</tspan></text>
<rect x="640.0" y="306.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="740.0" y="322.5">4. Add the profile to the</tspan><tspan x="740.0" y="337.5">KYC review queue</tspan></text>
<rect x="330.0" y="396.0" width="220" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="440.0" y="412.5">5. Check the documents and</tspan><tspan x="440.0" y="427.5">the authority to represent</tspan></text>
<polygon points="440.0,485.0 455.0,500 440.0,515.0 425.0,500" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="335.0" y="556.0" width="210" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="440.0" y="572.5">6. Verify KYC and enter</tspan><tspan x="440.0" y="587.5">the authorization expiry</tspan></text>
<rect x="640.0" y="556.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="740.0" y="572.5">7. Enable trading and</tspan><tspan x="740.0" y="587.5">e-mail the result</tspan></text>
<circle cx="740.0" cy="660" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="740.0" cy="660" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="813.8" y="660.0">Account verified</tspan></text>
<rect x="350.0" y="740.0" width="180" height="40" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="440.0" y="760.0">8. Reject with a reason</tspan></text>
<rect x="640.0" y="736.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="740.0" y="752.5">9. E-mail the</tspan><tspan x="740.0" y="767.5">rejection reason</tspan></text>
<circle cx="740.0" cy="840" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="740.0" cy="840" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="653.0" y="840.0">Account not verified</tspan></text>
</svg>