<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="150.0" y="132.5">1. Import plots from KML</tspan><tspan x="150.0" y="147.5">or a GPS pin</tspan></text>
<rect x="360.0" y="116.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="460.0" y="132.5">2. Check the file and</tspan><tspan x="460.0" y="147.5">the plot geometry</tspan></text>
<polygon points="460.0,205.0 475.0,220 460.0,235.0 445.0,220" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="370.0" y="276.0" width="180" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="460.0" y="292.5">3. Show the errors</tspan><tspan x="460.0" y="307.5">per plot</tspan></text>
<rect x="50.0" y="276.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="150.0" y="292.5">4. Fix the plots and</tspan><tspan x="150.0" y="307.5">import them again</tspan></text>
<rect x="350.0" y="376.0" width="220" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="460.0" y="392.5">5. Save the plots and run</tspan><tspan x="460.0" y="407.5">the forest-risk check</tspan></text>
