<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="120.0" y="237.5">4. Fix the plots and</tspan><tspan x="120.0" y="252.5">import them again</tspan></text>
<rect x="265.0" y="308.5" width="190" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="360.0" y="325.0">5. Save the plots and</tspan><tspan x="360.0" y="340.0">run the forest-risk</tspan><tspan x="360.0" y="355.0">check</tspan></text>
