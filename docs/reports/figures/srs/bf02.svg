<rect x="45.0" y="616.0" width="210" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="150.0" y="632.5">7. Create a product with</tspan><tspan x="150.0" y="647.5">category and plots</tspan></text>
