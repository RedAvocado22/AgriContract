<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="120.0" y="530.0">7. Create a product</tspan><tspan x="120.0" y="545.0">with category and</tspan><tspan x="120.0" y="560.0">plots</tspan></text>
