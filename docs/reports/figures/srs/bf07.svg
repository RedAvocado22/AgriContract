<path d="M580.0,561.5 L580.0,610 L440.0,610" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M350.0,674.5 L350.0,641.5" fill="none" stroke="black" stroke-width="1.1" stroke-dasharray="5,4"/>
