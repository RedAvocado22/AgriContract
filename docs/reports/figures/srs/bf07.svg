<path d="M120.0,714.0 L120.0,770 L485.0,770" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M580.0,801.5 L580.0,816.0" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M580.0,864.0 L580.0,889.0" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<circle cx="120.0" cy="55" r="12.0" fill="black"/>
<rect x="25.0" y="91.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="120.0" y="107.5">1. Detect a suspected</tspan><tspan x="120.0" y="122.5">incident</tspan></text>
<rect x="25.0" y="161.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="120.0" y="177.5">2. Send a signed</tspan><tspan x="120.0" y="192.5">LOCK request</tspan></text>
<rect x="485.0" y="153.5" width="190" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="580.0" y="170.0">3. Verify the key,</tspan><tspan x="580.0" y="185.0">signature, time</tspan><tspan x="580.0" y="200.0">and nonce</tspan></text>
<polygon points="580.0,240.0 595.0,255 580.0,270.0 565.0,255" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="485.0" y="296.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="580.0" y="312.5">4. Reject the request</tspan><tspan x="580.0" y="327.5">with an error code</tspan></text>
<circle cx="580.0" cy="380" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="580.0" cy="380" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="515.287109375" y="380.0">Lock not applied</tspan></text>
<rect x="485.0" y="436.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="580.0" y="452.5">5. Stop all money</tspan><tspan x="580.0" y="467.5">commands</tspan></text>
<rect x="485.0" y="498.5" width="190" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="580.0" y="515.0">6. Record the lock,</tspan><tspan x="580.0" y="530.0">notify Admin and</tspan><tspan x="580.0" y="545.0">the verifier</tspan></text>
<rect x="260.0" y="578.5" width="180" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="350.0" y="595.0">7. Investigate and</tspan><tspan x="350.0" y="610.0">report to the</tspan><tspan x="350.0" y="625.0">verifier</tspan></text>
<path d="M275.0,674.5 L415.0,674.5 L425.0,684.5 L425.0,705.5 L275.0,705.5 Z" fill="white" stroke="black"/><path d="M415.0,674.5 L415.0,684.5 L425.0,684.5" fill="none" stroke="black"/>
<text text-anchor="start" dominant-baseline="central" font-size="12"><tspan x="285.0" y="690.0">Admin cannot unlock</tspan></text>
<rect x="25.0" y="666.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="120.0" y="682.5">8. Send a signed</tspan><tspan x="120.0" y="697.5">UNLOCK request</tspan></text>
<rect x="485.0" y="738.5" width="190" height="63.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="580.0" y="755.0">9. Verify the request</tspan><tspan x="580.0" y="770.0">and resume money</tspan><tspan x="580.0" y="785.0">commands</tspan></text>
<rect x="485.0" y="816.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="580.0" y="832.5">10. Record the unlock</tspan><tspan x="580.0" y="847.5">and notify</tspan></text>
<circle cx="580.0" cy="902" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="580.0" cy="902" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="580.0" y="928.5">Money flow resumed</tspan></text>
</svg>