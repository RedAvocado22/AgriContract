<path d="M595.0,255 L690,255 L690,415 L580.0,415 L580.0,436.0" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<rect x="600.0" y="237" width="32.734375" height="13.75" fill="white"/>
<text text-anchor="start" dominant-baseline="central" font-size="11"><tspan x="602.0" y="243.875">[valid]</tspan></text>
