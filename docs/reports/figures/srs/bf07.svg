<rect x="55.0" y="106.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="150.0" y="122.5">1. Detect a suspected</tspan><tspan x="150.0" y="137.5">incident</tspan></text>
<rect x="55.0" y="186.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="150.0" y="202.5">2. Send a signed</tspan><tspan x="150.0" y="217.5">LOCK request</tspan></text>
<rect x="610.0" y="186.0" width="220" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="720.0" y="202.5">3. Verify the key, signature,</tspan><tspan x="720.0" y="217.5">time and nonce</tspan></text>
<polygon points="720.0,275.0 735.0,290 720.0,305.0 705.0,290" fill="white" stroke="black" stroke-width="1.2"/>
<rect x="620.0" y="346.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="720.0" y="362.5">4. Reject the request</tspan><tspan x="720.0" y="377.5">with an error code</tspan></text>
<circle cx="720.0" cy="440" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="720.0" cy="440" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="655.287109375" y="440.0">Lock not applied</tspan></text>
<rect x="620.0" y="526.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="720.0" y="542.5">5. Stop all money</tspan><tspan x="720.0" y="557.5">commands</tspan></text>
<rect x="610.0" y="606.0" width="220" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="720.0" y="622.5">6. Record the lock, notify</tspan><tspan x="720.0" y="637.5">Admin and the verifier</tspan></text>
<rect x="330.0" y="686.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="430.0" y="702.5">7. Investigate and report</tspan><tspan x="430.0" y="717.5">to the verifier</tspan></text>
<path d="M355.0,784.5 L495.0,784.5 L505.0,794.5 L505.0,815.5 L355.0,815.5 Z" fill="white" stroke="black"/><path d="M495.0,784.5 L495.0,794.5 L505.0,794.5" fill="none" stroke="black"/>
<text text-anchor="start" dominant-baseline="central" font-size="12"><tspan x="365.0" y="800.0">Admin cannot unlock</tspan></text>
<rect x="55.0" y="766.0" width="190" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="150.0" y="782.5">8. Send a signed</tspan><tspan x="150.0" y="797.5">UNLOCK request</tspan></text>
<rect x="610.0" y="856.0" width="220" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="720.0" y="872.5">9. Verify the request and</tspan><tspan x="720.0" y="887.5">resume money commands</tspan></text>
<rect x="620.0" y="936.0" width="200" height="48.0" rx="10" fill="white" stroke="black" stroke-width="1.2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="720.0" y="952.5">10. Record the unlock</tspan><tspan x="720.0" y="967.5">and notify</tspan></text>
<circle cx="720.0" cy="1030" r="13.0" fill="white" stroke="black" stroke-width="1.2"/><circle cx="720.0" cy="1030" r="8.0" fill="black"/>
<text text-anchor="middle" dominant-baseline="central" font-size="12"><tspan x="643.630859375" y="1030.0">Money flow resumed</tspan></text>
