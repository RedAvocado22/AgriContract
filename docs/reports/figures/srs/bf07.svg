<path d="M120.0,139.0 L120.0,161.0" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M215.0,185 L485.0,185" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M580.0,216.5 L580.0,240.0" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
<path d="M580.0,270.0 L580.0,296.0" fill="none" stroke="black" stroke-width="1.1" marker-end="url(#open)"/>
