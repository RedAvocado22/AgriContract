version: "3.9"

networks:
  agricontract-net:
    driver: bridge

volumes:
  user_db_data:
  product_db_data:
  contract_db_data:
  escrow_db_data:
  notification_db_data:
  inspection_db_data:
  reputation_db_data:
  bank_db_data:
  audit_db_data:
  analytics_db_data:
  file_db_data:
  pricing_db_data:
  object_storage_data:
  redis_data:
  clamav_data:
  keycloak_data:
  rabbitmq_data:
  mailhog_data:

services:
  # ── Infrastructure ────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD-SHELL", "(echo > /dev/tcp/localhost/8080) 2>/dev/null && exit 0 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailhog_data:/data
    networks:
      - agricontract-net

  user-db:
    image: mysql:8.0
    container_name: user-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: user_db
    ports:
      - "3307:3306"
    volumes:
      - user_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  product-db:
    image: mysql:8.0
    container_name: product-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: product_db
    ports:
      - "3308:3306"
    volumes:
      - product_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  contract-db:
    image: mysql:8.0
    container_name: contract-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: contract_db
    ports:
      - "3309:3306"
    volumes:
      - contract_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  escrow-db:
    image: mysql:8.0
    container_name: escrow-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: escrow_db
    ports:
      - "3310:3306"
    volumes:
      - escrow_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: mysql:8.0
    container_name: notification-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: notification_db
    ports:
      - "3311:3306"
    volumes:
      - notification_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  inspection-db:
    image: mysql:8.0
    container_name: inspection-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: inspection_db
    ports:
      - "3312:3306"
    volumes:
      - inspection_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  reputation-db:
    image: mysql:8.0
    container_name: reputation-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: reputation_db
    ports:
      - "3313:3306"
    volumes:
      - reputation_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  bank-db:
    image: mysql:8.0
    container_name: bank-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: bank_db
    ports:
      - "3314:3306"
    volumes:
      - bank_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-db:
    image: mysql:8.0
    container_name: audit-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: audit_db
    ports:
      - "3315:3306"
    volumes:
      - audit_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-db:
    image: mysql:8.0
    container_name: analytics-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: analytics_db
    ports:
      - "3316:3306"
    volumes:
      - analytics_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  file-db:
    image: mysql:8.0
    container_name: file-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: file_db
    ports:
      - "3317:3306"
    volumes:
      - file_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pricing-db:
    image: mysql:8.0
    container_name: pricing-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: pricing_db
    ports:
      - "3318:3306"
    volumes:
      - pricing_db_data:/var/lib/mysql
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for file-service (file-service-phase2-design §2.3: one flat bucket, key = fileId).
  # SeaweedFS instead of MinIO: MinIO stopped publishing community images (Oct 2025) and archived the repo.
  # S3 API on :8333; dev credentials in infra/seaweedfs/s3.json (access key agricontract).
  object-storage:
    image: chrislusf/seaweedfs:4.48
    container_name: object-storage
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"
    volumes:
      - object_storage_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/healthz" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Gateway rate-limit buckets (api-gateway-phase2-design: public pricing/reputation/audit-hash and auth routes).
  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Virus scan for uploaded files (file-service). OFF by default: clamd keeps every signature in memory
  # (~1GB+ RAM) and freshclam updates them on start. Start it only when testing the upload/scan flow:
  #   docker compose --profile scan up -d clamav
  # Signatures persist in clamav_data. Measured 24/10: healthy in ~40s on first start.
  clamav:
    image: clamav/clamav:1.4
    container_name: clamav
    profiles: [ "scan" ]
    ports:
      - "3410:3310"   # host 3310 is escrow-db; inside the network use clamav:3310
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - agricontract-net
    healthcheck:
      test: [ "CMD", "clamdcheck.sh" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

  # ── Services ──────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8888"
    environment:
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI:-http://keycloak:8080/realms/agricontract/protocol/openid-connect/certs}
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      CONTRACT_SERVICE_URL: http://contract-service:8083
      ESCROW_SERVICE_URL: http://escrow-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET must be set in .env}
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - agricontract-net

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    environment:
      DB_HOST: user-db
      DB_NAME: user_db
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI:-http://keycloak:8080/realms/agricontract/protocol/openid-connect/certs}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET must be set in .env}
      SERVICE_INTERNAL_SECRET: ${SERVICE_INTERNAL_SECRET:?SERVICE_INTERNAL_SECRET must be set in .env}
    depends_on:
      user-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - agricontract-net

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    environment:
      DB_HOST: product-db
      DB_PORT: 3306
      DB_NAME: product_db
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI:-http://keycloak:8080/realms/agricontract/protocol/openid-connect/certs}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET must be set in .env}
      SERVICE_INTERNAL_SECRET: ${SERVICE_INTERNAL_SECRET:?SERVICE_INTERNAL_SECRET must be set in .env}
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      product-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - agricontract-net

  contract-service:
    build:
      context: .
      dockerfile: contract-service/Dockerfile
    container_name: contract-service
    environment:
      DB_HOST: contract-db
      DB_NAME: contract_db
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI:-http://keycloak:8080/realms/agricontract/protocol/openid-connect/certs}
      RABBITMQ_HOST: rabbitmq
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET must be set in .env}
      SERVICE_INTERNAL_SECRET: ${SERVICE_INTERNAL_SECRET:?SERVICE_INTERNAL_SECRET must be set in .env}
      PRODUCT_SERVICE_URL: http://product-service:8082
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      contract-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - agricontract-net

  escrow-service:
    build:
      context: .
      dockerfile: escrow-service/Dockerfile
    container_name: escrow-service
    environment:
      DB_HOST: escrow-db
      DB_NAME: escrow_db
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI:-http://keycloak:8080/realms/agricontract/protocol/openid-connect/certs}
      RABBITMQ_HOST: rabbitmq
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET must be set in .env}
    depends_on:
      escrow-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - agricontract-net

  notification-migrate:
    image: flyway/flyway:10.10.0
    container_name: notification-migrate
    command: -url=jdbc:mysql://notification-db:3306/notification_db?allowPublicKeyRetrieval=true -user=${DB_USERNAME:-root} -password=${DB_PASSWORD:-password} -connectRetries=20 migrate
    volumes:
      - ./notification-service-nest/db/migration:/flyway/sql:ro
    depends_on:
      notification-db:
        condition: service_healthy
    restart: "no"
    networks:
      - agricontract-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service-nest/Dockerfile
    container_name: notification-service
    # Above the app's 40s shutdown drain (a send in progress may take the 30s SMTP timeout)
    stop_grace_period: 60s
    environment:
      DB_HOST: notification-db
      DB_PORT: 3306
      DB_NAME: notification_db
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      RABBITMQ_HOST: rabbitmq
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    networks:
      - agricontract-net
