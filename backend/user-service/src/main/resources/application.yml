spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:user_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Required by the outbox poller: it must know a command was routed and confirmed before marking it published.
    publisher-confirm-type: correlated
    publisher-returns: true

agricontract:
  eventing:
    outbox:
      enabled: ${OUTBOX_POLLER_ENABLED:true}
      exchange: agricontract.user

user:
  # Register email ownership proof (design §4.4).
  email-verification:
    expiry-seconds: 600
    max-attempts: 5
    resend-cooldown-seconds: 60
    pepper: ${EMAIL_VERIFICATION_PEPPER:dev-only-email-verification-pepper}
  dlq-monitor:
    enabled: ${USER_DLQ_MONITOR_ENABLED:true}
    interval-ms: ${USER_DLQ_MONITOR_INTERVAL_MS:300000}
    timeout-ms: ${USER_DLQ_MONITOR_TIMEOUT_MS:3000}

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:changeme}

service:
  internal-secret: ${SERVICE_INTERNAL_SECRET:changeme-internal}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.agricontract: DEBUG

# Verification email goes through notification-service (POST /internal/v1/notifications/otp-email, VERIFY_EMAIL).
notification-service:
  url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
