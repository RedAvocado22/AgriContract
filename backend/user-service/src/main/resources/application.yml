spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:user_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Required by the outbox poller: it must know a command was routed and confirmed before marking it published.
    publisher-confirm-type: correlated
    publisher-returns: true

agricontract:
  eventing:
    outbox:
      enabled: ${OUTBOX_POLLER_ENABLED:true}
      exchange: agricontract.user

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:changeme}

service:
  internal-secret: ${SERVICE_INTERNAL_SECRET:changeme-internal}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.agricontract: DEBUG
