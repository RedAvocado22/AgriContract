# Loaded next to the main application.yml (and wins over it). Tests run without a broker, so the outbox poller is
# off; KycResultOutboxFlowIntegrationTest turns it back on against a RabbitMQ container.
agricontract.eventing.outbox.enabled=false
# Same for the reputation lock listener; ReputationLockFlowIntegrationTest starts it against its container.
spring.rabbitmq.listener.simple.auto-startup=false
user.dlq-monitor.enabled=false
