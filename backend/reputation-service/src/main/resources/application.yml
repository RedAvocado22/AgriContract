spring:
  application:
    name: reputation-service
  datasource:
    url: ${REPUTATION_DB_URL:jdbc:mysql://localhost:3306/reputation_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${REPUTATION_DB_USERNAME}
    password: ${REPUTATION_DB_PASSWORD}
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    url: ${spring.datasource.url}
    user: ${REPUTATION_MIGRATION_USERNAME}
    password: ${REPUTATION_MIGRATION_PASSWORD}
    clean-disabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}
service:
  internal-secret: ${SERVICE_INTERNAL_SECRET:}
server:
  port: ${SERVER_PORT:8088}
reputation:
  lock-expiry:
    enabled: ${REPUTATION_LOCK_EXPIRY_ENABLED:true}
    interval: ${REPUTATION_LOCK_EXPIRY_INTERVAL:PT1M}
    batch-size: ${REPUTATION_LOCK_EXPIRY_BATCH_SIZE:100}
  dlq-monitor:
    enabled: ${REPUTATION_DLQ_MONITOR_ENABLED:true}
    interval-ms: ${REPUTATION_DLQ_MONITOR_INTERVAL_MS:300000}
    timeout-ms: ${REPUTATION_DLQ_MONITOR_TIMEOUT_MS:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
agricontract:
  eventing:
    outbox:
      enabled: ${REPUTATION_OUTBOX_ENABLED:true}
      exchange: agricontract.reputation
