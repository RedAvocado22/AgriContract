spring:
  application:
    name: reputation-service
  datasource:
    url: ${REPUTATION_DB_URL:jdbc:mysql://localhost:3306/reputation_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${REPUTATION_DB_USERNAME}
    password: ${REPUTATION_DB_PASSWORD}
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    url: ${spring.datasource.url}
    user: ${REPUTATION_MIGRATION_USERNAME}
    password: ${REPUTATION_MIGRATION_PASSWORD}
    clean-disabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}
server:
  port: ${SERVER_PORT:8088}
reputation:
  dlq-monitor:
    enabled: ${REPUTATION_DLQ_MONITOR_ENABLED:true}
    interval-ms: ${REPUTATION_DLQ_MONITOR_INTERVAL_MS:300000}
    timeout-ms: ${REPUTATION_DLQ_MONITOR_TIMEOUT_MS:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
