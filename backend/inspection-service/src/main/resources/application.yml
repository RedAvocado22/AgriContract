spring:
  application:
    name: inspection-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3312}/inspection_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health

inspection:
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
    internal-secret: ${SERVICE_INTERNAL_SECRET}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
