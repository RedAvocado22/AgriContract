spring:
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
  application:
    name: inspection-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3312}/inspection_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

server:
  port: ${SERVER_PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health

inspection:
  dlq-monitor:
    enabled: true
    interval-ms: 300000
    timeout-ms: 3000
  assignment:
    waiting-retry-interval-ms: ${INSPECTION_WAITING_RETRY_INTERVAL_MS:3600000}
    scan-interval-ms: ${INSPECTION_ASSIGNMENT_SCAN_INTERVAL_MS:60000}
    scheduler-enabled: true
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
    internal-secret: ${SERVICE_INTERNAL_SECRET}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

agricontract:
  eventing:
    outbox:
      enabled: true
      exchange: agricontract.inspection
