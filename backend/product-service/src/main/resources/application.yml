spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:product_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # listener retry and no-requeue live in RabbitMQConfig: Boot's listener.simple.retry also retries rejected deliveries

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:changeme}

service:
  internal-secret: ${SERVICE_INTERNAL_SECRET:changeme-internal}

reputation-service:
  # listing search reads seller reputation with one internal batch call per page (X-Internal-Secret);
  # an outage or a timeout only degrades the search to reputationStatus=UNAVAILABLE
  url: ${REPUTATION_SERVICE_URL:http://localhost:8088}
  connect-timeout-ms: ${REPUTATION_SERVICE_CONNECT_TIMEOUT_MS:300}
  read-timeout-ms: ${REPUTATION_SERVICE_READ_TIMEOUT_MS:800}

plot:
  # a plot still PENDING after this becomes UNVERIFIED and can back a listing (design §2.2.4)
  geo-verification-timeout-hours: ${PLOT_GEO_VERIFICATION_TIMEOUT_HOURS:6}
  # local/Bruno runs: PLOT_GEO_VERIFICATION_TIMEOUT_HOURS=0 and a short check interval so a new plot is usable at once
  geo-verification-timeout-check-ms: ${PLOT_GEO_VERIFICATION_TIMEOUT_CHECK_MS:600000}
  forest-baseline:
    # rows of forest_baseline_coverage/forest_baseline_area (V9) used by the check; loaded by an operator
    dataset-version: ${PLOT_FOREST_BASELINE_DATASET_VERSION:natural-forests-2020-v1}
    check-ms: ${PLOT_FOREST_BASELINE_CHECK_MS:60000}
    batch-size: ${PLOT_FOREST_BASELINE_BATCH_SIZE:200}

reservation:
  # a RESERVED reservation with no contract.created after this is an orphan and gets released (design §8b.2)
  orphan-grace-minutes: ${RESERVATION_ORPHAN_GRACE_MINUTES:30}
  orphan-reaper-check-ms: ${RESERVATION_ORPHAN_REAPER_CHECK_MS:60000}
  orphan-reaper-batch-size: ${RESERVATION_ORPHAN_REAPER_BATCH_SIZE:100}

product:
  dlq-monitor:
    # WARN event=product_dlq_nonempty while product-svc.*.dlq has messages
    enabled: ${PRODUCT_DLQ_MONITOR_ENABLED:true}
    interval-ms: ${PRODUCT_DLQ_MONITOR_INTERVAL_MS:300000}
    timeout-ms: ${PRODUCT_DLQ_MONITOR_TIMEOUT_MS:3000}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8081}
  # CreateListing eligibility gate fails closed past these (user-service design §3, matrix 21f)
  connect-timeout-ms: 2000
  read-timeout-ms: 3000

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.agricontract: DEBUG
